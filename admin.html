    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, query, where, orderBy, serverTimestamp, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAs-6v3KND-ZMXOXv_5goBZ3NcvBEBN5Ak",
            authDomain: "tiendita-byb.firebaseapp.com",
            projectId: "tiendita-byb",
            storageBucket: "tiendita-byb.firebasestorage.app",
            messagingSenderId: "257958619653",
            appId: "1:257958619653:web:0367858d644596c4b50a6c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        try { await setPersistence(auth, browserSessionPersistence); } catch (e) { console.error('Persistencia:', e); }

        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebaseFns = {
            signInWithEmailAndPassword, signOut, onAuthStateChanged,
            collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc,
            query, where, orderBy, serverTimestamp, setDoc
        };

        window.CLOUDINARY_CLOUD_NAME = "natkrios";
        window.CLOUDINARY_UPLOAD_PRESET = "tiendita_preset";

        window.subirFotoCloudinary = async function(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', window.CLOUDINARY_UPLOAD_PRESET);
            const url = `https://api.cloudinary.com/v1_1/${window.CLOUDINARY_CLOUD_NAME}/image/upload`;
            const resp = await fetch(url, { method: 'POST', body: formData });
            if (!resp.ok) { const err = await resp.json().catch(() => ({})); throw new Error(err.error?.message || 'Error Cloudinary'); }
            const data = await resp.json();
            return data.secure_url;
        };

        window.dispatchEvent(new Event('firebase-listo'));
    </script>

    <script>
        /* ============================================================
           FUNCIONES COMPLETAS DE ADMIN
           ⚠️ Tu archivo original se cortó en verDetalleEncargo.
           Aquí reconstruí lo faltante y añadí las funciones nuevas
           de cotización. Si algo no coincide con tu original, avísame.
           ============================================================ */

        const ADMIN_EMAIL = "byb@gmail.com";
        const TIENDA_URL = "https://tienditabyb.github.io/compras/";

        let userData = null;
        let productosCache = [];
        let ventasCache = [];
        let domiciliosCache = [];
        let tiendaCache = [];
        let encargosCache = [];
        let serviciosCache = [];
        let categoriasCache = [];
        let usuariosCache = [];
        let carrito = [];
        let ventasFiltradasReporte = [];
        let configGeneral = { envio_costo: 1.00, envio_gratis_desde: 5.00, encargos_activos: true, servicios_activos: true };

        let notificaciones = [];
        const NOTIF_STORAGE_KEY = 'admin_notificaciones_leidas';

        function cargarNotificacionesLeidas() {
            try { const d = localStorage.getItem(NOTIF_STORAGE_KEY); return d ? JSON.parse(d) : []; } catch { return []; }
        }
        function guardarNotificacionesLeidas(l) { localStorage.setItem(NOTIF_STORAGE_KEY, JSON.stringify(l)); }

        function generarNotificaciones() {
            const n = [];
            const l = cargarNotificacionesLeidas();
            for (const d of domiciliosCache) {
                if (d.Estado === 'Pendiente' && !d.fecha_gestion) {
                    const id = `dom-${d.id}`;
                    if (!l.includes(id)) n.push({ id, tipo: 'domicilio', texto: `Nuevo domicilio de <strong>${d.Cliente_Nombre || 'Cliente'}</strong>`, fecha: d.fecha });
                }
            }
            for (const p of tiendaCache) {
                if (p.Estado === 'Pendiente' && !p.fecha_gestion) {
                    const id = `tienda-${p.id}`;
                    if (!l.includes(id)) n.push({ id, tipo: 'tienda', texto: `Nuevo pedido tienda de <strong>${p.Cliente_Nombre || 'Cliente'}</strong>`, fecha: p.fecha });
                }
            }
            for (const e of encargosCache) {
                if (e.estado === 'Pendiente' && !e.fecha_limite_pago) {
                    const id = `enc-${e.id}`;
                    if (!l.includes(id)) n.push({ id, tipo: 'encargo', texto: `Nuevo encargo de <strong>${e.producto_nombre || 'Producto'}</strong>`, fecha: e.fecha_solicitud });
                }
            }
            for (const s of serviciosCache) {
                if (s.estado === 'Pendiente' && !s.fecha_gestion) {
                    const id = `serv-${s.id}`;
                    if (!l.includes(id)) n.push({ id, tipo: 'servicio', texto: `Nueva solicitud de servicio de <strong>${s.usuario_nombre || 'Cliente'}</strong>`, fecha: s.fecha_solicitud });
                }
            }
            n.sort((a, b) => {
                const fa = a.fecha ? (a.fecha.seconds ? a.fecha.seconds * 1000 : new Date(a.fecha).getTime()) : 0;
                const fb = b.fecha ? (b.fecha.seconds ? b.fecha.seconds * 1000 : new Date(b.fecha).getTime()) : 0;
                return fb - fa;
            });
            notificaciones = n;
            const badge = document.getElementById('notifBadge');
            if (n.length > 0) { badge.textContent = n.length > 99 ? '99+' : n.length; badge.classList.add('show'); }
            else badge.classList.remove('show');
            renderNotificaciones();
        }

        function renderNotificaciones() {
            const list = document.getElementById('notifList');
            if (notificaciones.length === 0) { list.innerHTML = '<div class="notif-empty">✨ No hay notificaciones nuevas</div>'; return; }
            let html = '';
            for (const n of notificaciones) {
                let icon = '📦'; let tab = 'domicilios';
                if (n.tipo === 'tienda') { icon = '🏪'; tab = 'tienda'; }
                if (n.tipo === 'encargo') { icon = '📋'; tab = 'encargos'; }
                if (n.tipo === 'servicio') { icon = '🔧'; tab = 'servicios'; }
                html += `<div class="notif-item" data-id="${n.id}" data-tab="${tab}"><span class="icon">${icon}</span><span class="text">${n.texto}</span></div>`;
            }
            list.innerHTML = html;
            list.querySelectorAll('.notif-item').forEach(el => {
                el.addEventListener('click', function() {
                    const id = this.dataset.id, tab = this.dataset.tab;
                    const l = cargarNotificacionesLeidas();
                    if (!l.includes(id)) { l.push(id); guardarNotificacionesLeidas(l); }
                    notificaciones = notificaciones.filter(n => n.id !== id);
                    generarNotificaciones();
                    document.querySelectorAll('.sidebar__nav a').forEach(a => a.classList.remove('active'));
                    document.querySelector(`.sidebar__nav a[data-tab="${tab}"]`)?.classList.add('active');
                    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                    document.getElementById(`tab-${tab}`)?.classList.add('active');
                    document.getElementById('notifDropdown').classList.remove('open');
                });
            });
        }
        function actualizarNotificaciones() { generarNotificaciones(); }

        function iniciarListenerAuth() {
            window.firebaseFns.onAuthStateChanged(window.firebaseAuth, async (user) => {
                if (user) {
                    if (user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                        await window.firebaseFns.signOut(window.firebaseAuth);
                        document.getElementById('loginError').textContent = 'Acceso denegado.';
                        document.getElementById('loginError').classList.add('show');
                        return;
                    }
                    userData = { id: user.uid, email: user.email, name: user.displayName || user.email };
                    document.getElementById('loginContainer').style.display = 'none';
                    document.getElementById('appContainer').style.display = 'block';
                    document.getElementById('adminUserName').textContent = userData.name || userData.email || 'Administrador';
                    initApp();
                } else {
                    userData = null;
                    document.getElementById('loginContainer').style.display = 'flex';
                    document.getElementById('appContainer').style.display = 'none';
                }
            });
        }

        (function esperarFirebase() {
            if (window.firebaseFns && window.firebaseAuth) iniciarListenerAuth();
            else setTimeout(esperarFirebase, 100);
        })();

        document.getElementById('loginBtn').addEventListener('click', async function() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');
            errorEl.classList.remove('show'); errorEl.textContent = '';
            if (!email || !password) { errorEl.textContent = 'Ingresa email y contraseña.'; errorEl.classList.add('show'); return; }
            try {
                const { signInWithEmailAndPassword } = window.firebaseFns;
                await signInWithEmailAndPassword(window.firebaseAuth, email, password);
            } catch (e) {
                let msg = 'Error de autenticación';
                if (e.code === 'auth/user-not-found') msg = 'No existe una cuenta con este correo.';
                else if (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') msg = 'Correo o contraseña incorrectos.';
                errorEl.textContent = msg; errorEl.classList.add('show');
            }
        });

        document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });
        document.getElementById('loginEmail').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });
        document.getElementById('logoutBtn').addEventListener('click', async () => { await window.firebaseFns.signOut(window.firebaseAuth); });

        // === CARGA DE DATOS ===
        async function cargarCategorias() {
            try { const s = await window.firebaseFns.getDocs(window.firebaseFns.collection(window.firebaseDb, 'Categoria')); categoriasCache = s.docs.map(d => d.data().nombre).filter(Boolean); return categoriasCache; }
            catch (e) { return []; }
        }
        async function cargarProductos() {
            try { const s = await window.firebaseFns.getDocs(window.firebaseFns.collection(window.firebaseDb, 'productos')); productosCache = s.docs.map(d => ({ id: d.id, ...d.data() })); return productosCache; }
            catch (e) { return []; }
        }
        async function cargarVentas() {
            try {
                const { collection, getDocs, orderBy, query } = window.firebaseFns;
                const q = query(collection(window.firebaseDb, 'Ventas'), orderBy('fecha', 'desc'));
                const s = await getDocs(q); ventasCache = s.docs.map(d => ({ id: d.id, ...d.data() })); return ventasCache;
            } catch (e) { return []; }
        }
        async function cargarDomicilios() {
            try {
                const { collection, getDocs, orderBy, query } = window.firebaseFns;
                const q = query(collection(window.firebaseDb, 'Domicilios'), orderBy('fecha', 'desc'));
                const s = await getDocs(q); domiciliosCache = s.docs.map(d => ({ id: d.id, ...d.data() })); actualizarNotificaciones(); return domiciliosCache;
            } catch (e) { return []; }
        }
        async function cargarTienda() {
            try {
                const { collection, getDocs, orderBy, query } = window.firebaseFns;
                const q = query(collection(window.firebaseDb, 'PedidosTienda'), orderBy('fecha', 'desc'));
                const s = await getDocs(q); tiendaCache = s.docs.map(d => ({ id: d.id, ...d.data() })); actualizarNotificaciones(); return tiendaCache;
            } catch (e) { return []; }
        }
        async function cargarEncargos() {
            try {
                const { collection, getDocs, orderBy, query } = window.firebaseFns;
                const q = query(collection(window.firebaseDb, 'Encargos'), orderBy('fecha_solicitud', 'desc'));
                const s = await getDocs(q); encargosCache = s.docs.map(d => ({ id: d.id, ...d.data() })); actualizarNotificaciones(); return encargosCache;
            } catch (e) { return []; }
        }
        async function cargarServicios() {
            try {
                const { collection, getDocs, orderBy, query } = window.firebaseFns;
                const q = query(collection(window.firebaseDb, 'SolicitudesServicios'), orderBy('fecha_solicitud', 'desc'));
                const s = await getDocs(q); serviciosCache = s.docs.map(d => ({ id: d.id, ...d.data() })); actualizarNotificaciones(); return serviciosCache;
            } catch (e) { return []; }
        }
        async function cargarUsuarios() {
            try {
                const s = await window.firebaseFns.getDocs(window.firebaseFns.collection(window.firebaseDb, 'usuarios'));
                usuariosCache = s.docs.map(d => ({ id: d.id, ...d.data() }));
                usuariosCache.sort((a, b) => ((a.nombre || a.name || '').toLowerCase()).localeCompare((b.nombre || b.name || '').toLowerCase()));
                return usuariosCache;
            } catch (e) { return []; }
        }
        async function cargarConfigGeneral() {
            try {
                const snap = await window.firebaseFns.getDoc(window.firebaseFns.doc(window.firebaseDb, 'config', 'general'));
                if (snap.exists()) {
                    const data = snap.data();
                    if (typeof data.envio_costo === 'number') configGeneral.envio_costo = data.envio_costo;
                    if (typeof data.envio_gratis_desde === 'number') configGeneral.envio_gratis_desde = data.envio_gratis_desde;
                    if (typeof data.encargos_activos === 'boolean') configGeneral.encargos_activos = data.encargos_activos;
                    if (typeof data.servicios_activos === 'boolean') configGeneral.servicios_activos = data.servicios_activos;
                }
                document.getElementById('configEnvioCosto').value = configGeneral.envio_costo;
                document.getElementById('configEnvioGratis').value = configGeneral.envio_gratis_desde;
                document.getElementById('configEncargosActivos').checked = configGeneral.encargos_activos;
                document.getElementById('configServiciosActivos').checked = configGeneral.servicios_activos;
            } catch (e) { }
        }

        // === UTILIDADES ===
        function normalizarNombre(n) { if (!n) return ""; return n.replace(/\s*x\s*\d+/g, '').replace(/\s*\d+\s*uds?/g, '').trim().toLowerCase().replace(/\s+/g, ' '); }
        function extraerNombresProductos(t) { return !t ? [] : t.split(',').map(p => p.trim()).filter(Boolean); }
        function calcularCostoVenta(v) {
            const n = extraerNombresProductos(v.productos_json || '');
            let s = 0;
            for (let x of n) { const c = normalizarNombre(x); const p = productosCache.find(p => normalizarNombre(p.Nombre) === c); if (p) s += parseFloat(p.Precio_Costo || 0); }
            return s;
        }
        function calcularGananciaVenta(v) { return parseFloat(v.total || 0) - calcularCostoVenta(v); }
        function obtenerFotosProducto(p) {
            let f = [];
            if (p.Fotos) {
                if (Array.isArray(p.Fotos)) f = p.Fotos;
                else if (typeof p.Fotos === 'string') { try { const x = JSON.parse(p.Fotos); if (Array.isArray(x)) f = x; } catch (e) { f = p.Fotos.split(',').map(s => s.trim()).filter(Boolean); } }
            }
            return f;
        }
        function parsearProductosPedido(v) {
            if (!v) return [];
            if (Array.isArray(v)) return v;
            if (typeof v === 'string') { try { const p = JSON.parse(v); return Array.isArray(p) ? p : []; } catch (e) { return []; } }
            return [];
        }
        function fechaToDate(f) { if (!f) return null; if (f.seconds) return new Date(f.seconds * 1000); return new Date(f); }
        function fechaToStr(f) { const d = fechaToDate(f); return d ? d.toLocaleString('es-ES') : 'Sin fecha'; }
        function fechaToISO(f) { const d = fechaToDate(f); return d ? d.toISOString().slice(0,10) : ''; }

        function renderProductosPedidoConLinks(pp) {
            const items = parsearProductosPedido(pp);
            if (items.length === 0) return '';
            let h = '<div class="sub" style="margin-top:6px;"><strong>🛍️ Productos:</strong></div>';
            items.forEach(item => {
                const l = `${TIENDA_URL}?id=${item.id}`;
                const s = (parseFloat(item.precio || 0) * (item.cantidad || 1)).toFixed(2);
                h += `<div class="sub" style="padding-left:12px;">• <a href="${l}" target="_blank" style="color:#2980b9; font-weight:600; text-decoration:underline;">${item.nombre || 'Producto'}</a> x${item.cantidad || 1} - $${s}</div>`;
            });
            return h;
        }

        // === DASHBOARD ===
        function renderDashboard(ventas, domicilios) {
            const tv = ventas.length;
            const ing = ventas.reduce((s, v) => s + parseFloat(v.total || 0), 0);
            let g = 0; for (const v of ventas) g += calcularGananciaVenta(v);
            const p = domicilios.filter(d => d.Estado === 'Pendiente').length;
            let ci = 0, vi = 0;
            for (const x of productosCache) {
                if (x.Es_Encargo || x.Es_Proveedor || x.Es_Servicio) continue;
                const st = parseInt(x.Stock || 0);
                ci += st * parseFloat(x.Precio_Costo || 0);
                vi += st * parseFloat(x.Precio_Venta || 0);
            }
            document.getElementById('statVentas').textContent = tv;
            document.getElementById('statTotal').textContent = `$${ing.toFixed(2)}`;
            document.getElementById('statGanancia').textContent = `$${g.toFixed(2)}`;
            document.getElementById('statDomicilios').textContent = p;
            document.getElementById('statCostoInventario').textContent = `$${ci.toFixed(2)}`;
            document.getElementById('statGananciaPotencial').textContent = `$${(vi - ci).toFixed(2)}`;
            const u = ventas.slice(0, 5);
            const c = document.getElementById('ultimasVentas');
            if (u.length === 0) { c.innerHTML = '<div class="empty">No hay ventas recientes.</div>'; return; }
            let h = '';
            for (const v of u) h += `<div class="list-item" onclick="verDetalleVenta('${v.id}')" style="cursor:pointer;"><div class="left"><div class="title">${v.productos_json || 'Sin productos'}</div><div class="sub">${fechaToStr(v.fecha)} • ${v.Tipo || 'Local'}</div></div><div class="right">$${parseFloat(v.total || 0).toFixed(2)}</div></div>`;
            c.innerHTML = h;
        }

        // === ESTADÍSTICAS ===
        function aplicarRangoEst(r) {
            const hoy = new Date();
            let d = new Date(); const h = new Date();
            switch (r) {
                case 'hoy': d = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()); break;
                case '7dias': d = new Date(hoy.getTime() - 7 * 86400000); break;
                case '30dias': d = new Date(hoy.getTime() - 30 * 86400000); break;
                case 'mes': d = new Date(hoy.getFullYear(), hoy.getMonth(), 1); break;
                case 'todo': document.getElementById('estFechaDesde').value = ''; document.getElementById('estFechaHasta').value = ''; document.querySelectorAll('#tab-estadisticas .rango-rapido button').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); renderizarEstadisticas(); return;
            }
            document.getElementById('estFechaDesde').value = d.toISOString().slice(0,10);
            document.getElementById('estFechaHasta').value = h.toISOString().slice(0,10);
            document.querySelectorAll('#tab-estadisticas .rango-rapido button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderizarEstadisticas();
        }

        function renderizarEstadisticas() {
            const d = document.getElementById('estFechaDesde').value;
            const h = document.getElementById('estFechaHasta').value;
            let f = [...ventasCache];
            if (d) f = f.filter(v => fechaToISO(v.fecha) >= d);
            if (h) f = f.filter(v => fechaToISO(v.fecha) <= h);
            const c = document.getElementById('estadisticasContenido');
            if (f.length === 0) { c.innerHTML = '<div class="empty">No hay ventas en el período.</div>'; return; }
            let ti = 0, tg = 0, tc = 0;
            const pC = {}, cC = {};
            for (const v of f) {
                ti += parseFloat(v.total || 0);
                const co = calcularCostoVenta(v); tc += co; tg += (parseFloat(v.total || 0) - co);
                const items = extraerNombresProductos(v.productos_json || '');
                for (const n of items) {
                    const m = n.match(/^(.+?)\s*x\s*(\d+)$/);
                    let pn, ct;
                    if (m) { pn = m[1].trim(); ct = parseInt(m[2]); } else { pn = n; ct = 1; }
                    if (!pC[pn]) pC[pn] = { cantidad: 0, ingresos: 0 };
                    pC[pn].cantidad += ct;
                    const prod = productosCache.find(p => normalizarNombre(p.Nombre) === normalizarNombre(pn));
                    const pr = prod ? parseFloat(prod.Precio_Venta || 0) : 0;
                    pC[pn].ingresos += pr * ct;
                    const cat = prod ? (prod.Categoria || 'General') : 'General';
                    if (!cC[cat]) cC[cat] = { cantidad: 0, ingresos: 0 };
                    cC[cat].cantidad += ct; cC[cat].ingresos += pr * ct;
                }
            }
            const tp = Object.entries(pC).sort((a,b) => b[1].cantidad - a[1].cantidad).slice(0, 10);
            const tca = Object.entries(cC).sort((a,b) => b[1].cantidad - a[1].cantidad).slice(0, 8);
            const tk = ti / f.length;
            let html = `<div class="stats-cards">
                <div class="stat-card-new"><div class="value">${f.length}</div><div class="label">🛒 Ventas</div></div>
                <div class="stat-card-new green"><div class="value">$${ti.toFixed(2)}</div><div class="label">💰 Ingresos</div></div>
                <div class="stat-card-new orange"><div class="value">$${tg.toFixed(2)}</div><div class="label">📈 Ganancia</div></div>
                <div class="stat-card-new purple"><div class="value">$${tk.toFixed(2)}</div><div class="label">🎫 Ticket</div></div>
                <div class="stat-card-new red"><div class="value">$${tc.toFixed(2)}</div><div class="label">📦 Costo</div></div>
            </div><div class="ranking-list"><h3>🏆 Top 10 productos</h3>`;
            if (tp.length === 0) html += `<div class="empty">Sin datos.</div>`;
            else tp.forEach(([n, x], i) => {
                const rc = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
                html += `<div class="ranking-item"><div class="rank-num ${rc}">${i+1}</div><div class="rank-info"><div class="rank-name">${n}</div><div class="rank-sub">${x.cantidad} unidades</div></div><div class="rank-value">$${x.ingresos.toFixed(2)}</div></div>`;
            });
            html += `</div><div class="ranking-list"><h3>📂 Top categorías</h3>`;
            if (tca.length === 0) html += `<div class="empty">Sin datos.</div>`;
            else tca.forEach(([n, x], i) => {
                html += `<div class="ranking-item"><div class="rank-num">${i+1}</div><div class="rank-info"><div class="rank-name">${n}</div><div class="rank-sub">${x.cantidad} unidades</div></div><div class="rank-value">$${x.ingresos.toFixed(2)}</div></div>`;
            });
            html += `</div>`;
            c.innerHTML = html;
        }

        document.getElementById('estFiltrarBtn').addEventListener('click', renderizarEstadisticas);
        document.getElementById('estLimpiarBtn').addEventListener('click', function() {
            document.getElementById('estFechaDesde').value = '';
            document.getElementById('estFechaHasta').value = '';
            document.querySelectorAll('#tab-estadisticas .rango-rapido button').forEach(b => b.classList.remove('active'));
            renderizarEstadisticas();
        });

        // === USUARIOS ===
        function renderUsuarios() {
            const c = document.getElementById('usuariosContainer');
            const b = (document.getElementById('userSearch')?.value || '').toLowerCase().trim();
            let f = [...usuariosCache];
            if (b) f = f.filter(u => (u.nombre || '').toLowerCase().includes(b) || (u.apellidos || '').toLowerCase().includes(b) || (u.email || '').toLowerCase().includes(b) || (u.telefono || '').toLowerCase().includes(b) || (u.name || '').toLowerCase().includes(b));
            document.getElementById('usuariosCount').textContent = `${usuariosCache.length} usuario${usuariosCache.length === 1 ? '' : 's'}`;

        async function guardarUsuarioEditado() {
            const id = document.getElementById('editUserId').value;
            const n = document.getElementById('editUserNombre').value.trim();
            const a = document.getElementById('editUserApellidos').value.trim();
            const t = document.getElementById('editUserTelefono').value.trim();

            if (!n || n.length < 2) { alert('⚠️ El nombre es obligatorio (mín. 2 letras).'); return; }

        function notificarServicio(id) {
            const s = serviciosCache.find(x => x.id === id);

            if (!tel || tel === 'Sin teléfono') { alert('❌ Sin teléfono.'); return; }
            tel = String(tel).trim();
            const st = s.estado || 'Pendiente';
            const serv = s.servicio_nombre || 'Servicio';
            let m = '';
            switch (st) {

        function recalcularServicio() {
            const body = document.getElementById('servicioDetailBody');
            if (!body) return;
            const componentes = JSON.parse(body.dataset.componentes || '[]');
            let totalMat = 0;
            document.querySelectorAll('.precio-input').forEach(inp => {
                const i = parseInt(inp.dataset.index);
                const precio = parseFloat(inp.value) || 0;
                const cant = componentes[i]?.cantidad || 0;
                const sub = precio * cant;
                totalMat += sub;
                const cell = document.querySelector(`.subtotal-cell[data-index="${i}"]`);
                if (cell) cell.textContent = '$' + sub.toFixed(2);
            });
            const mano = parseFloat(document.getElementById('servicioManoObra').value) || 0;
            document.getElementById('servicioSubMat').textContent = '$' + totalMat.toFixed(2);
            document.getElementById('servicioSubMano').textContent = '$' + mano.toFixed(2);
            document.getElementById('servicioTotal').textContent = '$' + (totalMat + mano).toFixed(2);
        }

        async function guardarCotizacionServicio(id) {
            const body = document.getElementById('servicioDetailBody');
            const componentes = JSON.parse(body.dataset.componentes || '[]');
            document.querySelectorAll('.precio-input').forEach(inp => {
                const i = parseInt(inp.dataset.index);
                componentes[i].precio = parseFloat(inp.value) || 0;
            });
            const mano = parseFloat(document.getElementById('servicioManoObra').value) || 0;
            const totalMat = componentes.reduce((s, c) => s + (c.precio || 0) * (c.cantidad || 0), 0);
            const total = totalMat + mano;

            try {
                const { doc, updateDoc, serverTimestamp } = window.firebaseFns;
                await updateDoc(doc(window.firebaseDb, 'SolicitudesServicios', id), {
                    componentes: componentes,
                    mano_obra: mano,
                    total_presupuesto: total,
                    moneda: 'USD',
                    estado: 'Cotizado',
                    fecha_cotizacion: serverTimestamp(),
                    fecha_actualizacion: serverTimestamp()
                });
                alert('✅ Cotización guardada y servicio marcado como Cotizado.');
                await cargarServicios();
                aplicarFiltrosServicios();
            } catch (e) { alert('Error: ' + e.message); }
        }

        function enviarCotizacionWA(id) {
            const body = document.getElementById('servicioDetailBody');
            const componentes = JSON.parse(body.dataset.componentes || '[]');
            const tel = body.dataset.telefono;
            if (!tel) { alert('Sin teléfono.'); return; }
            let telLimpio = String(tel).replace(/[^0-9]/g, '');
            if (telLimpio.length === 8) telLimpio = '53' + telLimpio;

            document.querySelectorAll('.precio-input').forEach(inp => {
                const i = parseInt(inp.dataset.index);
                componentes[i].precio = parseFloat(inp.value) || 0;

            const mano = parseFloat(document.getElementById('servicioManoObra').value) || 0;

            let lineas = '', totalMat = 0;
            componentes.forEach(c => {

                const sub = (c.precio || 0) * c.cantidad;
                totalMat += sub;

            const total = totalMat + mano;

            const msg = `*COTIZACIÓN B&B*\n\n` +
                `👤 ${body.dataset.nombre}\n` +
                `🔧 ${body.dataset.servicio}\n\n` +
                `*MATERIALES:*\n${lineas}\n` +
                `*Mano de obra:* $${mano.toFixed(2)}\n\n` +
                `*TOTAL: $${total.toFixed(2)} USD*`;

            window.open(`https://wa.me/${telLimpio}?text=${encodeURIComponent(msg)}`, '_blank');

            const p = tiendaCache.find(x => x.id === id);
            if (!p || !p.Telefono) { alert('Sin teléfono.'); return; }
            let tel = String(p.Telefono).replace(/[^0-9]/g, '');
            if (tel.length === 8) tel = '53' + tel;
            const msg = `Hola ${p.Cliente_Nombre || 'Cliente'} 👋\nTu pedido está en estado: *${p.Estado || 'Pendiente'}*.`;
            window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // === PRODUCTOS ===
        function editarProducto(id) {
            const p = productosCache.find(x => x.id === id);
            if (!p) { alert('No encontrado.'); return; }
            document.getElementById('productModalTitle').textContent = 'Editar Producto';
            document.getElementById('productId').value = p.id;
            document.getElementById('prodNombre').value = p.Nombre || '';
            document.getElementById('prodCodigo').value = p.Codigo_de_Barras || '';
            document.getElementById('prodCosto').value = p.Precio_Costo || '';
            document.getElementById('prodVenta').value = p.Precio_Venta || '';
            document.getElementById('prodOferta').value = p.Precio_Oferta || '';
            document.getElementById('prodStock').value = p.Stock || '';
            document.getElementById('prodDetalles').value = p.Detalles || '';
            document.getElementById('prodEsProveedor').checked = p.Es_Proveedor === true;
            document.getElementById('prodEsEncargo').checked = p.Es_Encargo === true;
            document.getElementById('prodEsServicio').checked = p.Es_Servicio === true;
            document.getElementById('prodProveedor').value = p.Proveedor || '';
            document.getElementById('prodUrlEncargo').value = p.URL_Encargo || '';
            document.getElementById('proveedorGroup').style.display = p.Es_Proveedor ? 'block' : 'none';
            document.getElementById('urlEncargoGroup').style.display = p.Es_Encargo ? 'block' : 'none';
            document.getElementById('servicioNoteGroup').style.display = p.Es_Servicio ? 'block' : 'none';
            document.getElementById('stockGroup').style.display = p.Es_Servicio ? 'none' : 'block';
            // Fotos
            const fo = obtenerFotosProducto(p);
            const prev = document.getElementById('prodFotosPreview');
            prev.innerHTML = '';
            fo.forEach(url => {
                const div = document.createElement('div');
                div.className = 'foto-item';
                div.innerHTML = `<img src="${url}" /><button type="button" class="btn-remove" onclick="this.parentElement.remove()">✕</button>`;
                prev.appendChild(div);
            });
            document.getElementById('productDeleteBtn').style.display = 'inline-block';
            document.getElementById('productModal').classList.add('active');
        }

        async function eliminarProducto(id) {
            if (!confirm('¿Eliminar este producto?')) return;
            try {
                await window.firebaseFns.deleteDoc(window.firebaseFns.doc(window.firebaseDb, 'productos', id));
                alert('✅ Producto eliminado.');
                await cargarProductos();
                renderInventario(productosCache);
            } catch (e) { alert('Error: ' + e.message); }
        }

        document.getElementById('btnNuevoProducto').addEventListener('click', function() {
            document.getElementById('productModalTitle').textContent = 'Nuevo Producto';
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('prodFotosPreview').innerHTML = '';
            document.getElementById('productDeleteBtn').style.display = 'none';
            document.getElementById('proveedorGroup').style.display = 'none';
            document.getElementById('urlEncargoGroup').style.display = 'none';
            document.getElementById('servicioNoteGroup').style.display = 'none';
            document.getElementById('diagnosticoGroup').style.display = 'none';
            document.getElementById('stockGroup').style.display = 'block';
            document.getElementById('categoriaGroup').style.display = 'block';
            document.getElementById('servicioInfoGroup').style.display = 'none';
            document.getElementById('productModal').classList.add('active');
        });

        document.getElementById('prodEsProveedor').addEventListener('change', function() {
            document.getElementById('proveedorGroup').style.display = this.checked ? 'block' : 'none';
        });
        document.getElementById('prodEsEncargo').addEventListener('change', function() {
            document.getElementById('urlEncargoGroup').style.display = this.checked ? 'block' : 'none';
        });
        document.getElementById('prodEsServicio').addEventListener('change', function() {
            document.getElementById('servicioNoteGroup').style.display = this.checked ? 'block' : 'none';
            document.getElementById('stockGroup').style.display = this.checked ? 'none' : 'block';
            document.getElementById('categoriaGroup').style.display = this.checked ? 'none' : 'block';
            document.getElementById('servicioInfoGroup').style.display = this.checked ? 'block' : 'none';
            document.getElementById('diagnosticoGroup').style.display = this.checked ? 'block' : 'none';
        });

        document.getElementById('productForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('productSubmitBtn');
            btn.disabled = true; btn.textContent = '⏳ Guardando...';
            try {
                const id = document.getElementById('productId').value;
                const fotosNuevas = document.getElementById('prodFotos').files;
                let fotos = [];
                if (fotosNuevas && fotosNuevas.length > 0) {
                    for (let i = 0; i < fotosNuevas.length; i++) {
                        const url = await window.subirFotoCloudinary(fotosNuevas[i]);
                        fotos.push(url);
                    }
                }
                // Fotos viejas que quedaron en el preview
                const fotosPreview = document.querySelectorAll('#prodFotosPreview img');
                const fotosViejas = Array.from(fotosPreview).map(img => img.src).filter(s => s.startsWith('http'));
                fotos = [...fotosViejas, ...fotos];

                const data = {
                    Nombre: document.getElementById('prodNombre').value.trim(),
                    Codigo_de_Barras: document.getElementById('prodCodigo').value.trim(),
                    Precio_Costo: parseFloat(document.getElementById('prodCosto').value) || 0,
                    Precio_Venta: parseFloat(document.getElementById('prodVenta').value) || 0,
                    Precio_Oferta: parseFloat(document.getElementById('prodOferta').value) || 0,
                    Stock: parseInt(document.getElementById('prodStock').value) || 0,
                    Detalles: document.getElementById('prodDetalles').value.trim(),
                    Categoria: document.getElementById('prodCategoria').value || 'General',
                    Es_Proveedor: document.getElementById('prodEsProveedor').checked,
                    Proveedor: document.getElementById('prodProveedor').value.trim(),
                    Es_Encargo: document.getElementById('prodEsEncargo').checked,
                    URL_Encargo: document.getElementById('prodUrlEncargo').value.trim(),
                    Es_Servicio: document.getElementById('prodEsServicio').checked,
                    Fotos: fotos,
                    fecha_actualizacion: window.firebaseFns.serverTimestamp()
                };
                if (id) {
                    await window.firebaseFns.updateDoc(window.firebaseFns.doc(window.firebaseDb, 'productos', id), data);
                } else {
                    await window.firebaseFns.addDoc(window.firebaseFns.collection(window.firebaseDb, 'productos'), data);
                }
                alert('✅ Producto guardado.');
                document.getElementById('productModal').classList.remove('active');
                await cargarProductos();
                renderInventario(productosCache);
            } catch (err) { alert('Error: ' + err.message); }
            finally { btn.disabled = false; btn.textContent = 'Guardar'; }
        });

        document.getElementById('productCancelBtn').addEventListener('click', () => document.getElementById('productModal').classList.remove('active'));
        document.getElementById('closeProductModal').addEventListener('click', () => document.getElementById('productModal').classList.remove('active'));
        document.getElementById('closeDetailModal').addEventListener('click', () => document.getElementById('detailModal').classList.remove('active'));
        document.getElementById('productDeleteBtn').addEventListener('click', () => {
            const id = document.getElementById('productId').value;
            if (id) { document.getElementById('productModal').classList.remove('active'); eliminarProducto(id); }
        });

        document.getElementById('invSearch').addEventListener('input', function() {
            renderInventario(productosCache, document.getElementById('invCategory').value, this.value);
        });
        document.getElementById('invCategory').addEventListener('change', function() {
            renderInventario(productosCache, this.value, document.getElementById('invSearch').value);
        });
        document.getElementById('invRefreshBtn').addEventListener('click', async function() {
            this.disabled = true; this.textContent = '⏳...';
            await cargarProductos(); renderInventario(productosCache);
            this.disabled = false; this.textContent = '🔄 Refrescar';
        });

        // === CONFIGURACIÓN ===
        document.getElementById('guardarConfigBtn').addEventListener('click', async function() {
            const btn = this;
            btn.disabled = true; btn.textContent = '⏳...';
            try {
                await window.firebaseFns.setDoc(window.firebaseFns.doc(window.firebaseDb, 'config', 'general'), {
                    envio_costo: parseFloat(document.getElementById('configEnvioCosto').value) || 0,
                    envio_gratis_desde: parseFloat(document.getElementById('configEnvioGratis').value) || 0,
                    encargos_activos: document.getElementById('configEncargosActivos').checked,
                    servicios_activos: document.getElementById('configServiciosActivos').checked,
                    fecha_actualizacion: window.firebaseFns.serverTimestamp()
                }, { merge: true });
                const s = document.getElementById('configSuccess');
                s.classList.add('show');
                setTimeout(() => s.classList.remove('show'), 3000);
            } catch (e) { alert('Error: ' + e.message); }
            finally { btn.disabled = false; btn.textContent = '💾 Guardar Configuración'; }
        });

        // === CAJA (venta manual) ===
        document.getElementById('cajaAgregarBtn').addEventListener('click', function() {
            const busq = document.getElementById('cajaBusqueda').value.trim().toLowerCase();
            const cant = parseInt(document.getElementById('cajaCantidad').value) || 1;
            const p = productosCache.find(x => (x.Nombre || '').toLowerCase() === busq);
            if (!p) { alert('Producto no encontrado.'); return; }
            carrito.push({ id: p.id, nombre: p.Nombre, cantidad: cant, precio: parseFloat(p.Precio_Venta || 0) });
            renderCarrito();
            document.getElementById('cajaBusqueda').value = '';
            document.getElementById('cajaSugerencias').style.display = 'none';
        });

        function renderCarrito() {
            const c = document.getElementById('cajaCarrito');
            if (carrito.length === 0) { c.innerHTML = '<div class="empty">No hay productos agregados.</div>'; document.getElementById('cajaTotal').textContent = 'Total: $0.00'; return; }
            let h = '';
            carrito.forEach((it, i) => {
                h += `<div class="carrito-item"><div class="info">${it.nombre}</div><div class="precio">${it.cantidad} × $${it.precio.toFixed(2)} = $${(it.cantidad * it.precio).toFixed(2)}</div><button class="btn-eliminar" onclick="carrito.splice(${i},1); renderCarrito()">✕</button></div>`;
            });
            c.innerHTML = h;
            const total = carrito.reduce((s, it) => s + it.cantidad * it.precio, 0);
            document.getElementById('cajaTotal').textContent = 'Total: $' + total.toFixed(2);
        }

        document.getElementById('cajaBusqueda').addEventListener('input', function() {
            const q = this.value.trim().toLowerCase();
            const sug = document.getElementById('cajaSugerencias');
            if (q.length < 2) { sug.style.display = 'none'; return; }
            const matches = productosCache.filter(p => (p.Nombre || '').toLowerCase().includes(q) && !p.Es_Servicio).slice(0, 8);
            if (matches.length === 0) { sug.style.display = 'none'; return; }
            sug.innerHTML = matches.map(p => `<div class="sugerencia-item" onclick="seleccionarSugerencia('${p.Nombre}')"><div class="nombre">${p.Nombre}</div><div class="detalle">$${parseFloat(p.Precio_Venta || 0).toFixed(2)}</div></div>`).join('');
            sug.style.display = 'block';
        });
        function seleccionarSugerencia(nombre) {
            document.getElementById('cajaBusqueda').value = nombre;
            document.getElementById('cajaSugerencias').style.display = 'none';
        }
        document.getElementById('cajaLimpiarBtn').addEventListener('click', function() {
            carrito = []; renderCarrito();
            document.getElementById('cajaCliente').value = '';
            document.getElementById('cajaTelefono').value = '';
            document.getElementById('cajaDireccion').value = '';
        });
        document.getElementById('cajaRegistrarBtn').addEventListener('click', async function() {
            if (carrito.length === 0) { alert('Agrega productos.'); return; }
            const cliente = document.getElementById('cajaCliente').value.trim();
            if (!cliente) { alert('Ingresa el nombre del cliente.'); return; }
            const total = carrito.reduce((s, it) => s + it.cantidad * it.precio, 0);
            const productosJson = carrito.map(it => `${it.nombre} x${it.cantidad}`).join(', ');
            try {
                await window.firebaseFns.addDoc(window.firebaseFns.collection(window.firebaseDb, 'Ventas'), {
                    Cliente_Nombre: cliente,
                    Telefono: document.getElementById('cajaTelefono').value.trim(),
                    Direccion: document.getElementById('cajaDireccion').value.trim(),
                    productos_json: productosJson,
                    total: total,
                    Tipo: 'Local',
                    fecha: window.firebaseFns.serverTimestamp()
                });
                alert('✅ Venta registrada.');
                carrito = []; renderCarrito();
                document.getElementById('cajaCliente').value = '';
                document.getElementById('cajaTelefono').value = '';
                document.getElementById('cajaDireccion').value = '';
                await cargarVentas();
            } catch (e) { alert('Error: ' + e.message); }
        });

        // === REPORTES ===
        function aplicarRangoReporte(r) {
            const hoy = new Date();
            let d = new Date(); const h = new Date();
            switch (r) {
                case 'hoy': d = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()); break;
                case '7dias': d = new Date(hoy.getTime() - 7 * 86400000); break;
                case '30dias': d = new Date(hoy.getTime() - 30 * 86400000); break;
                case 'mes': d = new Date(hoy.getFullYear(), hoy.getMonth(), 1); break;
                case 'mesAnterior': d = new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1); h.setDate(0); break;
            }
            document.getElementById('repFechaDesde').value = d.toISOString().slice(0,10);
            document.getElementById('repFechaHasta').value = h.toISOString().slice(0,10);
            document.querySelectorAll('#tab-reportes .rango-rapido button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderReportes();
        }

        function renderReportes() {
            const d = document.getElementById('repFechaDesde').value;
            const h = document.getElementById('repFechaHasta').value;
            const t = document.getElementById('repTipo').value;
            let f = [...ventasCache];
            if (d) f = f.filter(v => fechaToISO(v.fecha) >= d);
            if (h) f = f.filter(v => fechaToISO(v.fecha) <= h);
            if (t !== 'Todos') f = f.filter(v => (v.Tipo || 'Local') === t);
            ventasFiltradasReporte = f;
            let ti = 0, tc = 0;
            for (const v of f) { ti += parseFloat(v.total || 0); tc += calcularCostoVenta(v); }
            document.getElementById('repTotalVentas').textContent = '$' + ti.toFixed(2);
            document.getElementById('repCostoVendido').textContent = '$' + tc.toFixed(2);
            document.getElementById('repGananciaTotal').textContent = '$' + (ti - tc).toFixed(2);
            document.getElementById('repCount').textContent = f.length;
            const c = document.getElementById('reportesContainer');
            if (f.length === 0) { c.innerHTML = '<div class="empty">Sin ventas en el período.</div>'; return; }
            let hh = '';
            for (const v of f) hh += `<div class="list-item"><div class="left"><div class="title">${v.productos_json || 'Sin productos'}</div><div class="sub">${fechaToStr(v.fecha)} • ${v.Tipo || 'Local'}</div></div><div class="right">$${parseFloat(v.total || 0).toFixed(2)}</div></div>`;
            c.innerHTML = hh;
        }

        document.getElementById('repFiltrarBtn').addEventListener('click', renderReportes);
        document.getElementById('repLimpiarBtn').addEventListener('click', function() {
            document.getElementById('repFechaDesde').value = '';
            document.getElementById('repFechaHasta').value = '';
            document.getElementById('repTipo').value = 'Todos';
            document.querySelectorAll('#tab-reportes .rango-rapido button').forEach(b => b.classList.remove('active'));
            renderReportes();
        });

        document.getElementById('btnExportarReportes').addEventListener('click', function() {
            if (ventasFiltradasReporte.length === 0) { alert('No hay ventas para exportar.'); return; }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(18);
            doc.text('Reporte de Ventas', 105, 15, { align: 'center' });
            doc.setFontSize(10);
            doc.text(`Desde: ${document.getElementById('repFechaDesde').value || 'Inicio'} - Hasta: ${document.getElementById('repFechaHasta').value || 'Hoy'}`, 105, 22, { align: 'center' });
            const rows = ventasFiltradasReporte.map(v => [fechaToStr(v.fecha), v.productos_json || '', v.Tipo || 'Local', '$' + parseFloat(v.total || 0).toFixed(2)]);
            doc.autoTable({
                head: [['Fecha', 'Productos', 'Tipo', 'Total']],
                body: rows,
                startY: 30,
                styles: { fontSize: 8 }
            });
            const total = ventasFiltradasReporte.reduce((s, v) => s + parseFloat(v.total || 0), 0);
            doc.text(`TOTAL: $${total.toFixed(2)}`, 105, doc.lastAutoTable.finalY + 10, { align: 'right' });
            doc.save('reporte-ventas.pdf');
        });

        document.getElementById('btnExportarInventario').addEventListener('click', function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(18);
            doc.text('Inventario', 105, 15, { align: 'center' });
            const rows = productosCache.map(p => [p.Nombre || '', p.Categoria || '', p.Stock || 0, '$' + parseFloat(p.Precio_Venta || 0).toFixed(2)]);
            doc.autoTable({
                head: [['Producto', 'Categoría', 'Stock', 'Precio']],
                body: rows,
                startY: 25,
                styles: { fontSize: 8 }
            });
            doc.save('inventario.pdf');
        });

        // === SIDEBAR Y MENÚ ===
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebarOverlay').classList.add('active');
        });
        document.getElementById('closeSidebarBtn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        });
        document.getElementById('sidebarOverlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        });

        document.querySelectorAll('.sidebar__nav a').forEach(a => {
            a.addEventListener('click', function() {
                const tab = this.dataset.tab;
                document.querySelectorAll('.sidebar__nav a').forEach(x => x.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
                document.getElementById('tab-' + tab)?.classList.add('active');
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('active');
                if (tab === 'inventario') renderInventario(productosCache, document.getElementById('invCategory').value, document.getElementById('invSearch').value);
                if (tab === 'ventas') aplicarFiltrosVentas();
                if (tab === 'domicilios') aplicarFiltrosDomicilios();
                if (tab === 'tienda') aplicarFiltrosTienda();
                if (tab === 'encargos') aplicarFiltrosEncargos();
                if (tab === 'servicios') aplicarFiltrosServicios();
                if (tab === 'reportes') renderReportes();
                if (tab === 'usuarios') renderUsuarios();
            });
        });

        // === NOTIFICACIONES ===
        document.getElementById('notifBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            document.getElementById('notifDropdown').classList.toggle('open');
        });
        document.addEventListener('click', function(e) {
            const d = document.getElementById('notifDropdown');
            if (!d.contains(e.target) && e.target.id !== 'notifBtn') d.classList.remove('open');
        });

        // === INIT ===
        async function initApp() {
            document.getElementById('estadisticasContenido').innerHTML = '<div class="loading"><div class="spinner"></div>Cargando...</div>';
            await Promise.all([
                cargarCategorias(), cargarProductos(), cargarVentas(),
                cargarDomicilios(), cargarTienda(), cargarEncargos(),
                cargarServicios(), cargarUsuarios(), cargarConfigGeneral()
            ]);
            renderDashboard(ventasCache, domiciliosCache);
            renderizarEstadisticas();
            renderInventario(productosCache);
            renderVentas(ventasCache);
            renderDomicilios(domiciliosCache);
            renderTienda(tiendaCache);
            renderEncargos(encargosCache);
            renderServicios(serviciosCache);
            renderUsuarios();
            aplicarFiltrosVentas();
            generarNotificaciones();
            // Poblar select de categorías en modal producto
            const selCat = document.getElementById('prodCategoria');
            if (selCat) {
                selCat.innerHTML = '<option value="General">General</option>' + categoriasCache.map(c => `<option value="${c}">${c}</option>`).join('');
            }
        }

        // === CATEGORÍAS ===
        document.getElementById('agregarCategoriaBtn')?.addEventListener('click', async function() {
            const n = document.getElementById('nuevaCategoriaInput').value.trim();
            if (!n) return;
            try {
                await window.firebaseFns.addDoc(window.firebaseFns.collection(window.firebaseDb, 'Categoria'), { nombre: n });
                document.getElementById('nuevaCategoriaInput').value = '';
                await cargarCategorias();
                const sel = document.getElementById('prodCategoria');
                sel.innerHTML = '<option value="General">General</option>' + categoriasCache.map(c => `<option value="${c}">${c}</option>`).join('');
                alert('✅ Categoría agregada.');
            } catch (e) { alert('Error: ' + e.message); }
        });

        document.getElementById('eliminarCategoriaBtn')?.addEventListener('click', async function() {
            const n = document.getElementById('prodCategoria').value;
            if (!n || n === 'General') { alert('Selecciona una categoría válida.'); return; }
            if (!confirm(`¿Eliminar la categoría "${n}"?`)) return;
            try {
                const snap = await window.firebaseFns.getDocs(window.firebaseFns.collection(window.firebaseDb, 'Categoria'));
                const match = snap.docs.find(d => d.data().nombre === n);
                if (match) await window.firebaseFns.deleteDoc(window.firebaseFns.doc(window.firebaseDb, 'Categoria', match.id));
                await cargarCategorias();
                const sel = document.getElementById('prodCategoria');
                sel.innerHTML = '<option value="General">General</option>' + categoriasCache.map(c => `<option value="${c}">${c}</option>`).join('');
                alert('✅ Categoría eliminada.');
            } catch (e) { alert('Error: ' + e.message); }
        });
    </script>
</body>
